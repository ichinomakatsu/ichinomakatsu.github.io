<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thư viện Sticker Makatsu</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --accent: #FF6B6B;
            --danger: #ff4757;
            --success: #2ed573;
            --overlay: rgba(0, 0, 0, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        header {
            width: 100%; max-width: 800px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; position: relative;
            z-index: 1000;
        }

        h1 { 
            font-size: 1.5rem; margin: 0;
            background: linear-gradient(45deg, #FF6B6B, #FFA502);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800; text-transform: uppercase;
        }

        .menu-container { position: relative; }
        
        .btn-menu {
            background: rgba(255,255,255,0.1); border: 1px solid #333;
            color: white; padding: 8px 15px; border-radius: 20px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            transition: 0.2s;
        }
        .btn-menu:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        .dropdown {
            position: absolute; top: 110%; right: 0;
            background: #252525; border: 1px solid #444;
            border-radius: 12px; width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; flex-direction: column; overflow: hidden;
            animation: fadeIn 0.2s ease;
        }
        .dropdown.show { display: flex; }
        
        .dropdown-item {
            padding: 12px 15px; text-align: left; background: none; border: none;
            color: #ddd; font-size: 15px; cursor: pointer; width: 100%;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #333;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:active { background: #333; }
        .dropdown-item span { font-size: 18px; }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px; width: 100%; max-width: 800px;
        }

        @media (min-width: 600px) {
            #gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        }

        .media-item {
            position: relative;
            background: var(--card-bg);
            border-radius: 12px; overflow: hidden;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }

        .media-item img, .media-item video {
            width: 100%; height: 100%; object-fit: cover;
            display: block; pointer-events: none;
        }

        .media-item.selected {
            border: 3px solid var(--accent);
            transform: scale(0.9);
            opacity: 0.6;
        }
        .media-item.selected::after {
            content: "✓"; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--accent); color: white;
            border-radius: 50%; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .pagination {
            display: flex; gap: 15px; margin-top: 25px; align-items: center;
            background: #2c2c2c; padding: 8px 20px; border-radius: 30px;
        }
        .pagination button { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        
        #action-panel {
            display: none;
            width: 100%; max-width: 800px;
            background: #252525; padding: 15px;
            border-radius: 15px; margin-top: 15px;
            border: 1px solid #444;
            flex-direction: column; align-items: center; gap: 10px;
            animation: slideUp 0.3s ease;
        }
        #action-panel.show { display: flex; }

        .action-info { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
        
        .action-btn-group { display: flex; gap: 10px; width: 100%; }
        
        .btn-action-main {
            flex: 2; padding: 12px; border-radius: 10px; border: none;
            font-weight: bold; color: white; cursor: pointer; font-size: 16px;
        }
        .btn-cancel {
            flex: 1; background: #444; color: white; border: none;
            padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }

        .bg-download { background: var(--success); }
        .bg-delete { background: var(--danger); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); z-index: 2000;
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #252525; padding: 25px; border-radius: 20px;
            width: 85%; max-width: 320px; text-align: center; border: 1px solid #444;
        }
        input {
            width: 100%; padding: 12px; background: #121212;
            border: 1px solid #444; border-radius: 10px;
            color: white; font-size: 16px; margin: 15px 0; outline: none; text-align: center;
        }
        
        #toast {
            visibility: hidden; min-width: 200px; background-color: #333;
            color: #fff; text-align: center; border-radius: 50px; padding: 12px 20px;
            position: fixed; z-index: 3000; left: 50%; bottom: 30px;
            transform: translateX(-50%); opacity: 0; transition: 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

        @keyframes fadeIn { from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:translateY(0)} }
        @keyframes slideUp { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

        .loader {
            border: 4px solid #333; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 0.8s linear infinite; margin: 50px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>✨ Sticker Makatsu</h1>
        
        <div class="menu-container">
            <button class="btn-menu" onclick="toggleMenu()">
                ⚙️ Cài đặt
            </button>
            <div id="dropdown-menu" class="dropdown">
                <button class="dropdown-item" onclick="openTokenModal()">
                    <span>🔑</span> Cập nhật Token
                </button>
                <button class="dropdown-item" onclick="activateMode('download')">
                    <span>⬇</span> Chọn Tải Nhiều
                </button>
                <button class="dropdown-item" style="color: var(--danger)" onclick="activateMode('delete')">
                    <span>🗑️</span> Chọn Xóa Nhiều
                </button>
            </div>
        </div>
    </header>
    
    <div id="loading" style="text-align: center;">
        <div class="loader"></div>
        <p style="color: #888;">Đang tải dữ liệu...</p>
    </div>

    <div id="gallery"></div>

    <div class="pagination">
        <button id="btn-prev" onclick="changePage(-1)">❮</button>
        <span id="page-info" style="font-weight: 800; font-size: 1rem; margin: 0 15px;">1 / 1</span>
        <button id="btn-next" onclick="changePage(1)">❯</button>
    </div>

    <div id="action-panel">
        <div class="action-info">Đã chọn: <span id="count-select">0</span> ảnh</div>
        <div class="action-btn-group">
            <button id="main-action-btn" class="btn-action-main" onclick="executeAction()">Thực hiện</button>
            <button class="btn-cancel" onclick="exitMode()">Hủy</button>
        </div>
    </div>

    <div id="view-modal" class="modal" onclick="if(event.target===this) closeModal()">
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div id="media-container" style="display: flex; justify-content: center; width: 100%;"></div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button id="single-download-btn" class="btn-menu" style="background: var(--success); border:none; padding: 10px 20px;">
                    ⬇ Tải về máy
                </button>
                <button class="btn-menu" onclick="closeModal()">Đóng</button>
            </div>
        </div>
    </div>

    <div id="token-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0;">🔑 Cài đặt Token</h3>
            <p style="font-size: 12px; color: #888;">Nhập Token GitHub để xóa ảnh.</p>
            <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
            <div style="display:flex; gap:10px">
                <button class="btn-cancel" style="width:100%" onclick="document.getElementById('token-modal').style.display='none'">Đóng</button>
                <button class="btn-action-main bg-success" style="width:100%; background: var(--accent)" onclick="saveToken()">Lưu</button>
            </div>
        </div>
    </div>

    <div id="pass-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0; color: var(--accent);">🔐 Admin Access</h3>
            <p style="font-size: 13px; color: #aaa;">Nhập mật khẩu để xóa</p>
            <input type="password" id="password-input" placeholder="Mật khẩu...">
            <div style="display: flex; gap: 10px;">
                <button class="btn-cancel" style="width:100%" onclick="document.getElementById('pass-modal').style.display='none'">Hủy</button>
                <button class="btn-action-main" style="width:100%; background: var(--accent)" onclick="verifyPassword()">Xóa ngay</button>
            </div>
        </div>
    </div>

    <div id="toast">Thông báo</div>

    <script>
        const REPO_OWNER = 'ichinomakatsu'; 
        const REPO_NAME = 'ichinomakatsu.github.io';
        const FOLDER_PATH = 'uploads';
        const ITEMS_PER_PAGE = 24;

        let allFiles = [];
        let currentPage = 1;
        let selectedFiles = new Set();
        let githubToken = localStorage.getItem('gh_token') || '';
        
        let currentMode = 'view'; 

        const gallery = document.getElementById('gallery');
        const loading = document.getElementById('loading');
        const actionPanel = document.getElementById('action-panel');
        const mainActionBtn = document.getElementById('main-action-btn');

        window.onload = loadFiles;

        function showToast(msg, isError = false) {
            const x = document.getElementById("toast");
            x.innerText = msg;
            x.style.backgroundColor = isError ? "#ff4757" : "#333";
            x.className = "show";
            setTimeout(() => x.className = x.className.replace("show", ""), 3000);
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const container = document.querySelector('.menu-container');
            if (!container.contains(e.target)) {
                document.getElementById('dropdown-menu').classList.remove('show');
            }
        });

        function openTokenModal() {
            document.getElementById('dropdown-menu').classList.remove('show');
            document.getElementById('token-input').value = githubToken;
            document.getElementById('token-modal').style.display = 'flex';
        }

        function activateMode(mode) {
            document.getElementById('dropdown-menu').classList.remove('show'); 
            currentMode = mode;
            selectedFiles.clear();
            renderPage(currentPage); 
            
            actionPanel.classList.add('show');
            updateCount();

            if (mode === 'download') {
                mainActionBtn.innerText = "⬇ Tải xuống máy";
                mainActionBtn.className = "btn-action-main bg-download";
                showToast("Chế độ TẢI: Chạm ảnh để chọn");
            } else if (mode === 'delete') {
                mainActionBtn.innerText = "🗑️ Xóa vĩnh viễn";
                mainActionBtn.className = "btn-action-main bg-delete";
                showToast("Chế độ XÓA: Chạm ảnh để chọn");
            }
        }

        function exitMode() {
            currentMode = 'view';
            selectedFiles.clear();
            actionPanel.classList.remove('show');
            renderPage(currentPage);
        }

        async function loadFiles() {
            loading.style.display = 'block';
            gallery.innerHTML = '';
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}?t=${Date.now()}`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    allFiles = data.filter(f => f.name.match(/\.(webp|jpg|jpeg|png|gif|mp4|webm)$/i)).reverse();
                    renderPage(1);
                } else {
                    gallery.innerHTML = '<p style="width:100%; text-align:center">Thư mục trống.</p>';
                }
            } catch (e) {
                gallery.innerHTML = '<p style="color:var(--danger); text-align:center">Lỗi tải dữ liệu.</p>';
            }
            loading.style.display = 'none';
        }

        function renderPage(page) {
            currentPage = page;
            gallery.innerHTML = '';
            const start = (page - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            
            allFiles.slice(start, end).forEach(file => {
                const item = document.createElement('div');
                item.className = 'media-item';
                if (selectedFiles.has(file.sha)) item.classList.add('selected');

                item.innerHTML = file.name.match(/\.(mp4|webm)$/i) 
                    ? `<video src="${file.download_url}#t=0.5" muted></video>`
                    : `<img src="${file.download_url}" loading="lazy">`;

                item.onclick = (e) => handleItemClick(file, item);
                
                gallery.appendChild(item);
            });
            updatePagination();
        }

        function handleItemClick(file, item) {
            if (currentMode === 'view') {
                openViewModal(file);
            } else {
                if (selectedFiles.has(file.sha)) {
                    selectedFiles.delete(file.sha);
                    item.classList.remove('selected');
                } else {
                    selectedFiles.add(file.sha);
                    item.classList.add('selected');
                }
                updateCount();
            }
        }

        function updateCount() {
            document.getElementById('count-select').innerText = selectedFiles.size;
        }

        function executeAction() {
            if (selectedFiles.size === 0) return showToast("Chưa chọn ảnh nào!", true);

            if (currentMode === 'download') {
                downloadSelectedFiles();
            } else if (currentMode === 'delete') {
                document.getElementById('pass-modal').style.display = 'flex';
                document.getElementById('password-input').focus();
            }
        }

        async function downloadSingleFile(url, name) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => window.URL.revokeObjectURL(blobUrl), 100);
                return true;
            } catch (err) {
                window.open(url, '_blank');
                return false;
            }
        }

        async function downloadSelectedFiles() {
            showToast("⏳ Đang bắt đầu tải...");
            let count = 0;
            const filesToDownload = Array.from(selectedFiles).map(sha => allFiles.find(f => f.sha === sha));

            for (const file of filesToDownload) {
                await downloadSingleFile(file.download_url, file.name);
                count++;
                
                await new Promise(resolve => setTimeout(resolve, 1500));
            }
            
            showToast(`✅ Đã tải ${count} ảnh xuống máy!`);
            exitMode();
        }

        async function verifyPassword() {
            const pass = document.getElementById('password-input').value;
            if (pass === 'ThanhDuyGaming') {
                document.getElementById('pass-modal').style.display = 'none';
                document.getElementById('password-input').value = '';
                
                if (!githubToken) {
                    showToast("Chưa có Token! Vào menu Cài đặt nhập nhé.", true);
                    openTokenModal();
                    return;
                }
                
                await deleteSelectedFiles();
            } else {
                showToast("Sai mật khẩu!", true);
            }
        }

        async function deleteSelectedFiles() {
            showToast("⏳ Đang xóa...");
            let deleted = 0;
            const filesToDelete = Array.from(selectedFiles).map(sha => allFiles.find(f => f.sha === sha));

            for (const file of filesToDelete) {
                const success = await deleteFileAPI(file);
                if (success) deleted++;
            }
            
            showToast(`✅ Đã xóa ${deleted} ảnh!`);
            exitMode();
            loadFiles();
        }

        async function deleteFileAPI(file) {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${file.path}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Delete ${file.name}`, sha: file.sha })
                });
                return res.ok;
            } catch (e) { return false; }
        }

        function openViewModal(file) {
            const container = document.getElementById('media-container');
            const btn = document.getElementById('single-download-btn');
            
            btn.onclick = () => {
                downloadSingleFile(file.download_url, file.name);
                showToast("Đang tải xuống...");
            };

            container.innerHTML = file.name.match(/\.(mp4|webm)$/i) 
                ? `<video src="${file.download_url}" controls autoplay style="max-width:100%; max-height:60vh; border-radius:10px"></video>`
                : `<img src="${file.download_url}" style="max-width:100%; max-height:60vh; border-radius:10px; box-shadow: 0 5px 20px black">`;
            
            document.getElementById('view-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('view-modal').style.display = 'none'; document.getElementById('media-container').innerHTML = ''; }

        function saveToken() {
            const t = document.getElementById('token-input').value.trim();
            if(t) { 
                localStorage.setItem('gh_token', t); 
                githubToken = t; 
                showToast('Đã lưu Token thành công!'); 
                document.getElementById('token-modal').style.display='none'; 
            }
        }

        function changePage(step) {
            const max = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            const next = currentPage + step;
            if (next >= 1 && next <= max) {
                if(currentMode !== 'view') {
                    if(!confirm("Chuyển trang sẽ hủy các ảnh đang chọn. Tiếp tục?")) return;
                    selectedFiles.clear();
                    updateCount();
                }
                renderPage(next);
            }
        }
        function updatePagination() {
            const max = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            document.getElementById('page-info').innerText = `${currentPage} / ${max || 1}`;
            document.getElementById('btn-prev').disabled = (currentPage === 1);
            document.getElementById('btn-next').disabled = (currentPage === max || max === 0);
        }
    </script>
</body>
</html>
