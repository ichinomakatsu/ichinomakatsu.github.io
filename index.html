<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thư viện Sticker của Makatsu</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CẤU HÌNH GIAO DIỆN MỚI --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --accent: #FF6B6B; /* Màu hồng cam nổi bật cho Sticker */
            --accent-hover: #ff8787;
            --danger: #ff4757;
            --overlay: rgba(0, 0, 0, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif; /* Font mới */
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header đẹp hơn */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        h1 { 
            font-size: 1.5rem; 
            margin: 0;
            background: linear-gradient(45deg, #FF6B6B, #FFA502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Nút cài đặt Token */
        .btn-icon {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .btn-icon:active { background: rgba(255,255,255,0.1); }

        /* --- LƯỚI ẢNH --- */
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); /* Tự động căn chỉnh */
            gap: 15px;
            width: 100%;
            max-width: 800px;
            padding-bottom: 100px;
        }

        .media-item {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s, border 0.2s;
            border: 2px solid transparent;
            user-select: none; 
            -webkit-user-select: none;
        }

        .media-item:active { transform: scale(0.95); }

        .media-item img, .media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Quan trọng để không bị chặn sự kiện touch */
        }

        /* Hiệu ứng khi chọn */
        .media-item.selected {
            border: 3px solid var(--accent);
            opacity: 0.8;
        }
        .media-item.selected::after {
            content: "✓";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- PHÂN TRANG --- */
        .pagination {
            display: flex; gap: 15px; margin-top: 20px; align-items: center;
            background: #2c2c2c; padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .pagination button {
            background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;
        }
        .pagination button:disabled { opacity: 0.3; }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay);
            z-index: 2000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            background: #252525; padding: 25px; border-radius: 20px;
            width: 85%; max-width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 15px;
            text-align: center;
            border: 1px solid #333;
        }

        input {
            width: 100%; padding: 15px; background: #121212;
            border: 1px solid #444; border-radius: 12px;
            color: white; font-size: 16px; outline: none;
            text-align: center;
        }
        input:focus { border-color: var(--accent); }

        /* Button Styles */
        button.btn-action {
            padding: 12px 20px; border-radius: 12px; font-weight: 700;
            border: none; cursor: pointer; font-family: 'Nunito', sans-serif;
            transition: 0.2s; width: 100%; font-size: 16px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: #444; color: white; }
        
        button.btn-action:active { transform: scale(0.95); }

        /* --- THANH CÔNG CỤ XÓA --- */
        #batch-delete-bar {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(150px);
            background: #252525; padding: 15px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #333;
            width: 90%; max-width: 400px; justify-content: space-between;
        }
        #batch-delete-bar.show { transform: translateX(-50%) translateY(0); }

        /* Toast & Loader */
        #toast {
            visibility: hidden; min-width: 200px; background-color: #333;
            color: #fff; text-align: center; border-radius: 50px; padding: 12px 24px;
            position: fixed; z-index: 3000; left: 50%; bottom: 30px;
            transform: translateX(-50%); font-size: 15px; opacity: 0;
            transition: opacity 0.3s, bottom 0.3s; font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 80px; }

        .loader {
            border: 4px solid #333; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 0.8s linear infinite; margin: 50px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        @keyframes popIn { 0% {transform: translate(-50%, -50%) scale(0);} 80% {transform: translate(-50%, -50%) scale(1.2);} 100% {transform: translate(-50%, -50%) scale(1);} }

    </style>
</head>
<body>

    <header>
        <h1>✨ Sticker Makatsu</h1>
        <button class="btn-icon" onclick="openTokenSettings()">⚙️</button>
    </header>
    
    <div id="loading" style="text-align: center;">
        <div class="loader"></div>
        <p style="color: #888;">Đang tải Sticker...</p>
    </div>

    <div id="gallery"></div>

    <div class="pagination">
        <button id="btn-prev" onclick="changePage(-1)">❮</button>
        <span id="page-info" style="font-weight: 800; font-size: 1rem;">1 / 1</span>
        <button id="btn-next" onclick="changePage(1)">❯</button>
    </div>

    <div id="batch-delete-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: bold; font-size: 1.2rem; color: var(--accent)" id="count-select">0</span>
            <span style="font-size: 0.9rem; color: #aaa;">đã chọn</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-action btn-danger" style="padding: 8px 15px;" onclick="confirmBatchDelete()">Xóa</button>
            <button class="btn-action btn-secondary" style="padding: 8px 15px;" onclick="cancelBatchMode()">Hủy</button>
        </div>
    </div>

    <div id="view-modal" class="modal" onclick="if(event.target===this) closeModal()">
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div id="media-container" style="display: flex; justify-content: center; align-items: center; width: 100%;"></div>
            
            <div style="margin-top: 25px; display: flex; gap: 15px; width: 90%; max-width: 300px;">
                <a id="download-btn" href="#" download class="btn-action btn-primary" style="text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center;">⬇ Tải Sticker</a>
                <button class="btn-action btn-secondary" onclick="closeModal()">Đóng</button>
            </div>
        </div>
    </div>

    <div id="pass-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0; color: var(--accent);">🔐 Admin Access</h3>
            <p style="font-size: 13px; color: #aaa; margin: 0;">Nhập mật khẩu để xóa sticker.</p>
            
            <input type="password" id="password-input" placeholder="Nhập mật khẩu...">
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-action btn-secondary" onclick="closePassModal()">Hủy</button>
                <button class="btn-action btn-primary" onclick="verifyPassword()">Xác nhận</button>
            </div>
        </div>
    </div>

    <div id="token-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0;">🔑 GitHub Token</h3>
            <p style="font-size: 13px; color: #aaa;">Dán Token mới vào đây nếu không xóa được.</p>
            <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-action btn-secondary" onclick="document.getElementById('token-modal').style.display='none'">Đóng</button>
                <button class="btn-action btn-primary" onclick="saveToken()">Lưu Token</button>
            </div>
        </div>
    </div>

    <div id="delete-option-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0;">Chọn hành động</h3>
            <button class="btn-action btn-danger" onclick="processSingleDelete()">🗑️ Xóa Sticker này</button>
            <button class="btn-action btn-primary" onclick="enableBatchMode()">✨ Chọn nhiều Sticker</button>
            <button class="btn-action btn-secondary" onclick="closeDeleteOption()">Thoát</button>
        </div>
    </div>

    <div id="toast">Thông báo</div>

    <script>
        // --- CẤU HÌNH USER ---
        const REPO_OWNER = 'ichinomakatsu'; 
        const REPO_NAME = 'ichinomakatsu.github.io';
        const FOLDER_PATH = 'uploads';
        const ITEMS_PER_PAGE = 24; // Số lượng ảnh mỗi trang

        let allFiles = [];
        let currentPage = 1;
        let isBatchMode = false;
        let selectedFiles = new Set();
        let longPressTimer;
        let isLongPress = false;
        let targetFile = null; // File đang tương tác

        // Lấy Token từ bộ nhớ
        let githubToken = localStorage.getItem('gh_token') || '';

        const gallery = document.getElementById('gallery');
        const loading = document.getElementById('loading');

        window.onload = loadFiles;

        function showToast(message, isError = false) {
            const x = document.getElementById("toast");
            x.innerText = message;
            x.style.backgroundColor = isError ? "#ff4757" : "#333";
            x.className = "show";
            setTimeout(() => x.className = x.className.replace("show", ""), 3000);
        }

        // --- TẢI FILE TỪ GITHUB ---
        async function loadFiles() {
            loading.style.display = 'block';
            gallery.innerHTML = '';
            try {
                // Thêm timestamp để tránh cache
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}?t=${new Date().getTime()}`);
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    // Lọc file ảnh/video
                    allFiles = data.filter(file => file.name.match(/\.(webp|jpg|jpeg|png|gif|mp4|webm)$/i));
                    // Sắp xếp mới nhất lên đầu (theo tên nếu tên có ngày tháng, hoặc đảo ngược mảng)
                    allFiles.reverse(); 
                    renderPage(1);
                } else {
                    gallery.innerHTML = '<p style="text-align:center; color:#888; width:100%">Thư mục trống hoặc lỗi API.</p>';
                }
            } catch (error) {
                console.error(error);
                gallery.innerHTML = '<p style="text-align:center; color: var(--danger)">Lỗi kết nối GitHub.</p>';
            }
            loading.style.display = 'none';
        }

        function renderPage(page) {
            currentPage = page;
            gallery.innerHTML = '';
            const start = (page - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            
            const currentFiles = allFiles.slice(start, end);

            currentFiles.forEach(file => {
                const item = document.createElement('div');
                item.className = 'media-item';
                if (selectedFiles.has(file.sha)) item.classList.add('selected');

                // Render Ảnh hoặc Video
                let content = file.name.match(/\.(mp4|webm)$/i) 
                    ? `<video src="${file.download_url}#t=0.5" preload="metadata" muted></video>`
                    : `<img src="${file.download_url}" loading="lazy" alt="${file.name}">`;
                item.innerHTML = content;

                // --- LOGIC CẢM ỨNG (FIXED) ---
                // Dùng pointer events để hỗ trợ cả chuột và cảm ứng tốt hơn
                item.addEventListener('touchstart', (e) => handleTouchStart(e, file, item), {passive: false});
                item.addEventListener('touchend', (e) => handleTouchEnd(e, file, item));
                item.addEventListener('touchmove', () => handleTouchMove());
                
                // Hỗ trợ chuột máy tính
                item.addEventListener('mousedown', (e) => handleTouchStart(e, file, item));
                item.addEventListener('mouseup', (e) => handleTouchEnd(e, file, item));
                item.addEventListener('click', (e) => e.stopPropagation()); // Chặn click mặc định

                gallery.appendChild(item);
            });
            updatePagination();
        }

        // --- XỬ LÝ SỰ KIỆN CHẠM (LOGIC MỚI) ---
        let touchStartTime = 0;
        let isDragging = false;

        function handleTouchStart(e, file, element) {
            if (isBatchMode) return; // Chế độ chọn nhiều thì bỏ qua logic này
            isDragging = false;
            isLongPress = false;
            targetFile = file;
            touchStartTime = new Date().getTime();

            // Đặt hẹn giờ cho Long Press (800ms)
            longPressTimer = setTimeout(() => {
                if (!isDragging) {
                    isLongPress = true;
                    if (navigator.vibrate) navigator.vibrate(50);
                    showPassModal(); // Hiện bảng nhập pass để xóa
                }
            }, 800);
        }

        function handleTouchMove() {
            isDragging = true;
            clearTimeout(longPressTimer); // Nếu di chuyển tay thì hủy long press
        }

        function handleTouchEnd(e, file, element) {
            clearTimeout(longPressTimer); // Hủy hẹn giờ
            
            if (isBatchMode) {
                // Nếu đang ở chế độ xóa nhiều, chạm là chọn
                e.preventDefault();
                toggleSelection(file, element);
                return;
            }

            if (isDragging) return; // Nếu là vuốt cuộn trang thì bỏ qua

            const touchDuration = new Date().getTime() - touchStartTime;

            // Nếu thời gian chạm ngắn (< 800ms) và không phải long press -> Là CLICK
            if (touchDuration < 800 && !isLongPress) {
                // Logic Click 1 lần -> Xem ảnh / Tải
                openViewModal(file);
            }
        }

        // --- CHỨC NĂNG XEM VÀ TẢI ---
        function openViewModal(file) {
            const modal = document.getElementById('view-modal');
            const container = document.getElementById('media-container');
            const downloadBtn = document.getElementById('download-btn');
            
            // Cập nhật link tải
            downloadBtn.href = file.download_url;
            
            // Hiển thị nội dung
            container.innerHTML = file.name.match(/\.(mp4|webm)$/i)
                ? `<video src="${file.download_url}" controls autoplay loop style="max-width:100%; max-height:60vh; border-radius:12px;"></video>`
                : `<img src="${file.download_url}" style="max-width:100%; max-height:60vh; border-radius:12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">`;
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('view-modal').style.display = 'none';
            document.getElementById('media-container').innerHTML = ''; // Xóa nội dung để dừng video
        }

        // --- CHỨC NĂNG BẢO MẬT & TOKEN ---
        function openTokenSettings() {
            document.getElementById('token-input').value = githubToken;
            document.getElementById('token-modal').style.display = 'flex';
        }

        function saveToken() {
            const token = document.getElementById('token-input').value.trim();
            if (token) {
                githubToken = token;
                localStorage.setItem('gh_token', token);
                showToast('✅ Đã lưu Token mới!');
                document.getElementById('token-modal').style.display = 'none';
            } else {
                showToast('❌ Token trống!', true);
            }
        }

        function showPassModal() {
            document.getElementById('pass-modal').style.display = 'flex';
            document.getElementById('password-input').focus();
        }

        function closePassModal() {
            document.getElementById('pass-modal').style.display = 'none';
            document.getElementById('password-input').value = '';
        }

        function verifyPassword() {
            const pass = document.getElementById('password-input').value;
            if (pass === 'ThanhDuyGaming') {
                closePassModal();
                // Nếu chưa có token thì bắt nhập
                if (!githubToken) {
                    showToast('⚠ Vui lòng nhập Token GitHub trước!', true);
                    openTokenSettings();
                } else {
                    document.getElementById('delete-option-modal').style.display = 'flex';
                }
            } else {
                showToast('❌ Mật khẩu sai!', true);
                document.getElementById('password-input').classList.add('shake');
                setTimeout(()=>document.getElementById('password-input').classList.remove('shake'), 500);
            }
        }

        function closeDeleteOption() { document.getElementById('delete-option-modal').style.display = 'none'; }

        // --- CHỨC NĂNG XÓA (SINGLE & BATCH) ---
        
        // 1. Xóa đơn lẻ
        async function processSingleDelete() {
            closeDeleteOption();
            if (!targetFile) return;
            
            if (confirm(`Bạn chắc chắn muốn xóa: ${targetFile.name}?`)) {
                showToast('⏳ Đang xóa...');
                const success = await deleteFileAPI(targetFile);
                if (success) {
                    showToast('✅ Đã xóa thành công!');
                    loadFiles();
                }
            }
        }

        // 2. Chế độ chọn nhiều
        function enableBatchMode() {
            closeDeleteOption();
            isBatchMode = true;
            selectedFiles.clear();
            if (targetFile) selectedFiles.add(targetFile.sha); // Chọn luôn file vừa nhấn giữ
            
            renderPage(currentPage);
            document.getElementById('batch-delete-bar').classList.add('show');
            showToast('Chạm vào ảnh để chọn thêm');
        }

        function cancelBatchMode() {
            isBatchMode = false;
            selectedFiles.clear();
            document.getElementById('batch-delete-bar').classList.remove('show');
            renderPage(currentPage);
        }

        function toggleSelection(file, element) {
            if (navigator.vibrate) navigator.vibrate(10);
            if (selectedFiles.has(file.sha)) {
                selectedFiles.delete(file.sha);
                element.classList.remove('selected');
            } else {
                selectedFiles.add(file.sha);
                element.classList.add('selected');
            }
            document.getElementById('count-select').innerText = selectedFiles.size;
        }

        async function confirmBatchDelete() {
            if (selectedFiles.size === 0) return showToast('Chưa chọn Sticker nào!', true);
            
            if (confirm(`Xóa vĩnh viễn ${selectedFiles.size} Sticker đã chọn?`)) {
                showToast('⏳ Đang xử lý...');
                let deletedCount = 0;
                
                // Chạy vòng lặp xóa
                for (const sha of selectedFiles) {
                    const file = allFiles.find(f => f.sha === sha);
                    if (file) {
                        const result = await deleteFileAPI(file, true);
                        if (result) deletedCount++;
                    }
                }
                
                showToast(`✅ Đã xóa ${deletedCount} Sticker!`);
                cancelBatchMode();
                loadFiles();
            }
        }

        // --- API DELETE (ĐÃ FIX TOKEN) ---
        async function deleteFileAPI(file, silent = false) {
            if (!githubToken) {
                if(!silent) showToast('❌ Thiếu Token GitHub!', true);
                return false;
            }

            try {
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${file.path}`;
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${githubToken}`, // Cấu trúc chuẩn
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Delete ${file.name} via Web Makatsu`,
                        sha: file.sha
                    })
                });

                if (res.ok) return true;
                
                // Xử lý lỗi
                const errData = await res.json();
                console.error("Delete Error:", errData);
                
                if (res.status === 401 || res.status === 403) {
                    if (!silent) {
                        showToast('❌ Token hết hạn hoặc sai quyền!', true);
                        openTokenSettings(); // Mở bảng nhập token ngay
                    }
                } else {
                    if (!silent) showToast('❌ Lỗi không xác định!', true);
                }
                return false;

            } catch (e) { 
                console.error(e); 
                return false; 
            }
        }

        // --- PHÂN TRANG ---
        function changePage(step) {
            const maxPage = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= maxPage) renderPage(newPage);
        }

        function updatePagination() {
            const maxPage = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            document.getElementById('page-info').innerText = `${currentPage} / ${maxPage || 1}`;
            document.getElementById('btn-prev').disabled = (currentPage === 1);
            document.getElementById('btn-next').disabled = (currentPage === maxPage || maxPage === 0);
        }
    </script>
</body>
      </html>
