<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thư viện Sticker Makatsu</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CẤU HÌNH GIAO DIỆN --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --accent: #FF6B6B;
            --danger: #ff4757;
            --overlay: rgba(0, 0, 0, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 80px; /* Chừa chỗ cho footer */
        }

        header {
            width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 0 5px;
        }

        h1 { 
            font-size: 1.5rem; margin: 0;
            background: linear-gradient(45deg, #FF6B6B, #FFA502);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800; text-transform: uppercase;
        }

        .btn-icon {
            background: transparent; border: none; font-size: 1.5rem;
            cursor: pointer; padding: 5px; border-radius: 50%;
        }

        /* --- LƯỚI ẢNH --- */
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px; width: 100%; max-width: 800px;
        }

        .media-item {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid transparent;
            user-select: none; -webkit-user-select: none;
        }

        .media-item:active { transform: scale(0.96); }

        .media-item img, .media-item video {
            width: 100%; height: 100%; object-fit: cover;
            display: block; pointer-events: none;
        }

        /* Tick xanh khi chọn */
        .media-item.selected {
            border: 3px solid var(--accent);
            opacity: 0.7;
        }
        .media-item.selected::after {
            content: "✓";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--accent); color: white;
            border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* --- PHÂN TRANG (CẢI TIẾN VỊ TRÍ) --- */
        .pagination {
            display: flex; gap: 15px; margin-top: 30px; align-items: center;
            background: #2c2c2c; padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, margin-bottom 0.3s ease;
            position: relative;
            z-index: 900;
        }
        
        /* Class này kích hoạt khi mở chế độ xóa */
        .pagination.lift-up {
            transform: translateY(-80px); /* Nhảy lên trên */
            background: rgba(44, 44, 44, 0.95);
            border: 1px solid var(--accent);
        }

        .pagination button {
            background: none; border: none; color: white;
            font-size: 1.2rem; cursor: pointer; padding: 0 10px;
        }
        .pagination button:disabled { opacity: 0.3; }

        /* --- THANH CÔNG CỤ XÓA --- */
        #batch-delete-bar {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(150px); /* Ẩn xuống dưới */
            background: #252525; padding: 15px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #444;
            width: 90%; max-width: 400px; justify-content: space-between;
        }
        #batch-delete-bar.show { transform: translateX(-50%) translateY(0); }

        /* --- MODAL --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); z-index: 2000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #252525; padding: 25px; border-radius: 20px;
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }

        input {
            width: 100%; padding: 12px; background: #121212;
            border: 1px solid #444; border-radius: 10px;
            color: white; font-size: 16px; margin: 15px 0; outline: none; text-align: center;
        }
        input:focus { border-color: var(--accent); }

        button.btn-action {
            padding: 10px 20px; border-radius: 10px; font-weight: 700;
            border: none; cursor: pointer; font-family: 'Nunito', sans-serif;
            width: 100%; margin-top: 5px; font-size: 15px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: #444; color: white; }

        /* Toast & Loader */
        #toast {
            visibility: hidden; min-width: 200px; background-color: #333;
            color: #fff; text-align: center; border-radius: 50px; padding: 12px;
            position: fixed; z-index: 3000; left: 50%; bottom: 30px;
            transform: translateX(-50%); opacity: 0; transition: 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 80px; }

        .loader {
            border: 4px solid #333; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 0.8s linear infinite; margin: 50px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <h1>✨ Sticker Makatsu</h1>
        <button class="btn-icon" onclick="openTokenSettings()">⚙️</button>
    </header>
    
    <div id="loading" style="text-align: center;">
        <div class="loader"></div>
        <p style="color: #888;">Đang tải dữ liệu...</p>
    </div>

    <div id="gallery"></div>

    <div class="pagination" id="pagination-bar">
        <button id="btn-prev" onclick="changePage(-1)">❮</button>
        <span id="page-info" style="font-weight: 800; font-size: 1rem; margin: 0 15px;">1 / 1</span>
        <button id="btn-next" onclick="changePage(1)">❯</button>
    </div>

    <div id="batch-delete-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: bold; font-size: 1.2rem; color: var(--accent)" id="count-select">0</span>
            <span style="font-size: 0.9rem; color: #aaa;">đã chọn</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-action btn-danger" style="width: auto;" onclick="confirmBatchDelete()">Xóa</button>
            <button class="btn-action btn-secondary" style="width: auto;" onclick="cancelBatchMode()">Hủy</button>
        </div>
    </div>

    <div id="view-modal" class="modal" onclick="if(event.target===this) closeModal()">
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div id="media-container" style="display: flex; justify-content: center; width: 100%;"></div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <a id="download-btn" href="#" download class="btn-action btn-primary" style="text-decoration: none; display:flex; align-items:center; justify-content:center; width: auto; padding: 10px 25px;">⬇ Tải về</a>
                <button class="btn-action btn-secondary" style="width: auto;" onclick="closeModal()">Đóng</button>
            </div>
        </div>
    </div>

    <div id="pass-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0; color: var(--accent);">🔐 Admin Access</h3>
            <p style="font-size: 13px; color: #aaa;">Nhập mật khẩu để xóa.</p>
            <input type="password" id="password-input" placeholder="Mật khẩu...">
            <div style="display: flex; gap: 10px;">
                <button class="btn-action btn-secondary" onclick="closePassModal()">Hủy</button>
                <button class="btn-action btn-primary" onclick="verifyPassword()">OK</button>
            </div>
        </div>
    </div>

    <div id="token-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin: 0;">🔑 Cài đặt Token</h3>
            <p style="font-size: 12px; color: #aaa;">Dán Token GitHub mới vào đây.</p>
            <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
            <button class="btn-action btn-primary" onclick="saveToken()">Lưu Token</button>
            <button class="btn-action btn-secondary" onclick="document.getElementById('token-modal').style.display='none'">Đóng</button>
        </div>
    </div>

    <div id="delete-option-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">Tùy chọn</h3>
            <button class="btn-action btn-danger" onclick="processSingleDelete()">🗑️ Xóa 1 ảnh này</button>
            <button class="btn-action btn-primary" onclick="enableBatchMode()">✨ Chọn nhiều ảnh</button>
            <button class="btn-action btn-secondary" onclick="closeDeleteOption()">Thoát</button>
        </div>
    </div>

    <div id="toast">Thông báo</div>

    <script>
        const REPO_OWNER = 'ichinomakatsu'; 
        const REPO_NAME = 'ichinomakatsu.github.io';
        const FOLDER_PATH = 'uploads';
        const ITEMS_PER_PAGE = 24;

        let allFiles = [];
        let currentPage = 1;
        let isBatchMode = false;
        let selectedFiles = new Set();
        let targetFile = null;
        let githubToken = localStorage.getItem('gh_token') || '';

        // --- BIẾN QUAN TRỌNG ĐỂ FIX LỖI VUỐT ---
        let startX = 0;
        let startY = 0;
        let isScrolling = false;
        let longPressTimer;

        const gallery = document.getElementById('gallery');
        const loading = document.getElementById('loading');

        window.onload = loadFiles;

        function showToast(msg, err = false) {
            const x = document.getElementById("toast");
            x.innerText = msg;
            x.style.backgroundColor = err ? "#ff4757" : "#333";
            x.className = "show";
            setTimeout(() => x.className = x.className.replace("show", ""), 3000);
        }

        async function loadFiles() {
            loading.style.display = 'block';
            gallery.innerHTML = '';
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}?t=${Date.now()}`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    allFiles = data.filter(f => f.name.match(/\.(webp|jpg|jpeg|png|gif|mp4|webm)$/i)).reverse();
                    renderPage(1);
                } else {
                    gallery.innerHTML = '<p style="width:100%; text-align:center">Thư mục trống.</p>';
                }
            } catch (e) {
                console.error(e);
                gallery.innerHTML = '<p style="color:var(--danger)">Lỗi tải dữ liệu.</p>';
            }
            loading.style.display = 'none';
        }

        function renderPage(page) {
            currentPage = page;
            gallery.innerHTML = '';
            const start = (page - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            
            allFiles.slice(start, end).forEach(file => {
                const item = document.createElement('div');
                item.className = 'media-item';
                if (selectedFiles.has(file.sha)) item.classList.add('selected');

                item.innerHTML = file.name.match(/\.(mp4|webm)$/i) 
                    ? `<video src="${file.download_url}#t=0.5" muted></video>`
                    : `<img src="${file.download_url}" loading="lazy">`;

                // --- SỰ KIỆN CẢM ỨNG (FIXED) ---
                item.addEventListener('touchstart', (e) => onTouchStart(e, file, item), {passive: false});
                item.addEventListener('touchmove', (e) => onTouchMove(e));
                item.addEventListener('touchend', (e) => onTouchEnd(e, file, item));
                
                // Chuột (PC)
                item.addEventListener('mousedown', (e) => onTouchStart(e, file, item));
                item.addEventListener('mouseup', (e) => onTouchEnd(e, file, item));
                item.addEventListener('click', e => e.preventDefault()); // Chặn click mặc định

                gallery.appendChild(item);
            });
            updatePagination();
        }

        // --- LOGIC XỬ LÝ CHẠM vs VUỐT ---
        function onTouchStart(e, file, item) {
            // Lưu tọa độ bắt đầu
            if (e.touches) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }
            
            isScrolling = false; // Reset trạng thái cuộn
            targetFile = file;

            if (!isBatchMode) {
                // Chỉ kích hoạt nhấn giữ nếu KHÔNG phải chế độ xóa
                longPressTimer = setTimeout(() => {
                    if (!isScrolling) {
                        if (navigator.vibrate) navigator.vibrate(50);
                        showPassModal();
                    }
                }, 800);
            }
        }

        function onTouchMove(e) {
            // Tính khoảng cách di chuyển
            let currentX, currentY;
            if (e.touches) {
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
            } else {
                currentX = e.clientX;
                currentY = e.clientY;
            }

            const diffX = Math.abs(currentX - startX);
            const diffY = Math.abs(currentY - startY);

            // Nếu di chuyển quá 10px thì coi là đang vuốt/cuộn trang
            if (diffX > 10 || diffY > 10) {
                isScrolling = true;
                clearTimeout(longPressTimer); // Hủy nhấn giữ ngay lập tức
            }
        }

        function onTouchEnd(e, file, item) {
            clearTimeout(longPressTimer); // Hủy bộ đếm nhấn giữ

            // Nếu người dùng đã vuốt (scroll), THÌ KHÔNG LÀM GÌ CẢ
            if (isScrolling) return;

            // Xử lý Click (khi không vuốt)
            if (isBatchMode) {
                // Chế độ xóa: Chọn/Bỏ chọn
                toggleSelection(file, item);
            } else {
                // Chế độ thường: Xem ảnh
                // Kiểm tra xem Pass Modal có đang hiện không để tránh click nhầm nền
                if (document.getElementById('pass-modal').style.display !== 'flex' && 
                    document.getElementById('delete-option-modal').style.display !== 'flex') {
                    openViewModal(file);
                }
            }
        }

        // --- CHỨC NĂNG KHÁC ---
        function enableBatchMode() {
            closeDeleteOption();
            isBatchMode = true;
            selectedFiles.clear();
            if (targetFile) selectedFiles.add(targetFile.sha);
            
            renderPage(currentPage);
            
            // Hiện thanh xóa & Đẩy thanh phân trang lên
            document.getElementById('batch-delete-bar').classList.add('show');
            document.getElementById('pagination-bar').classList.add('lift-up');
            
            showToast('Chạm vào ảnh để chọn');
        }

        function cancelBatchMode() {
            isBatchMode = false;
            selectedFiles.clear();
            
            // Ẩn thanh xóa & Hạ thanh phân trang xuống
            document.getElementById('batch-delete-bar').classList.remove('show');
            document.getElementById('pagination-bar').classList.remove('lift-up');
            
            renderPage(currentPage);
        }

        function toggleSelection(file, item) {
            if (navigator.vibrate) navigator.vibrate(10);
            if (selectedFiles.has(file.sha)) {
                selectedFiles.delete(file.sha);
                item.classList.remove('selected');
            } else {
                selectedFiles.add(file.sha);
                item.classList.add('selected');
            }
            document.getElementById('count-select').innerText = selectedFiles.size;
        }

        // --- API DELETE ---
        async function deleteFileAPI(file, silent = false) {
            if (!githubToken) return false;
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${file.path}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Delete ${file.name}`, sha: file.sha })
                });
                return res.ok;
            } catch (e) { return false; }
        }

        async function confirmBatchDelete() {
            if (selectedFiles.size === 0) return showToast('Chưa chọn ảnh!', true);
            if (confirm(`Xóa ${selectedFiles.size} ảnh?`)) {
                showToast('Đang xóa...');
                let count = 0;
                for (const sha of selectedFiles) {
                    const f = allFiles.find(x => x.sha === sha);
                    if (f && await deleteFileAPI(f, true)) count++;
                }
                showToast(`Đã xóa ${count} ảnh!`);
                cancelBatchMode();
                loadFiles();
            }
        }

        async function processSingleDelete() {
            closeDeleteOption();
            if (targetFile && confirm(`Xóa ${targetFile.name}?`)) {
                if (await deleteFileAPI(targetFile)) {
                    showToast('Đã xóa!');
                    loadFiles();
                } else {
                    showToast('Lỗi xóa!', true);
                }
            }
        }

        // --- AUTH & UTILS ---
        function verifyPassword() {
            if (document.getElementById('password-input').value === 'ThanhDuyGaming') {
                closePassModal();
                if (!githubToken) {
                    showToast('Cần nhập Token trước!', true);
                    openTokenSettings();
                } else {
                    document.getElementById('delete-option-modal').style.display = 'flex';
                }
            } else {
                showToast('Sai mật khẩu!', true);
            }
        }

        function openTokenSettings() { document.getElementById('token-modal').style.display = 'flex'; }
        function saveToken() {
            const t = document.getElementById('token-input').value.trim();
            if(t) { localStorage.setItem('gh_token', t); githubToken=t; showToast('Đã lưu Token'); document.getElementById('token-modal').style.display='none'; }
        }
        function openViewModal(f) {
            document.getElementById('download-btn').href = f.download_url;
            document.getElementById('media-container').innerHTML = f.name.match(/\.(mp4|webm)$/i) 
                ? `<video src="${f.download_url}" controls autoplay style="max-width:100%; max-height:60vh"></video>`
                : `<img src="${f.download_url}" style="max-width:100%; max-height:60vh; border-radius:10px">`;
            document.getElementById('view-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('view-modal').style.display = 'none'; document.getElementById('media-container').innerHTML = ''; }
        function closePassModal() { document.getElementById('pass-modal').style.display = 'none'; }
        function closeDeleteOption() { document.getElementById('delete-option-modal').style.display = 'none'; }

        function changePage(step) {
            const max = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            const next = currentPage + step;
            if (next >= 1 && next <= max) renderPage(next);
        }
        function updatePagination() {
            const max = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
            document.getElementById('page-info').innerText = `${currentPage} / ${max || 1}`;
            document.getElementById('btn-prev').disabled = (currentPage === 1);
            document.getElementById('btn-next').disabled = (currentPage === max || max === 0);
        }
    </script>
</body>
          </html>
